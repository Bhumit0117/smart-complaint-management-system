<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Department complaints | Smart Complaint System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar"><div class="container navbar-content"><a class="brand" href="department-dashboard.html">Smart <span>Complaint System</span></a><div class="nav-links"></div></div></nav>
<main class="page">
<div class="container">
<div class="page-title"><div><span class="eyebrow">DEPARTMENT PORTAL</span><h1 data-department-heading>Assigned complaints</h1><p class="text-muted">Only complaints assigned to your signed-in department are shown.</p></div></div>
<div class="stats-grid">
<div class="card stat-card"><small>Assigned</small><strong data-count="total">0</strong></div>
<div class="card stat-card"><small>Pending Admin Review</small><strong data-count="pending">0</strong></div>
<div class="card stat-card"><small>In progress</small><strong data-count="progress">0</strong></div>
<div class="card stat-card"><small>Resolved</small><strong data-count="resolved">0</strong></div>
</div>
<div class="card">
<div class="filters"><input data-filter="search" placeholder="Search assigned complaints"><select data-filter="status"><option>All</option><option>Forwarded to Department</option><option>In Progress</option><option>Resolved</option></select></div>
<div id="complaintList" class="complaint-list"></div>
</div>
</div>
</main>
<script src="js/data.js"></script><script src="js/script.js"></script>
</body>
</html>
