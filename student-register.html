<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create account | Smart Complaint System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-container">
<div class="auth-card">
<div class="brand-section">
<div class="logo">SCS</div>
<h1>Join Smart Complaint System</h1>
<p>Create a student profile and start reporting campus issues.</p>
</div>
<div class="form-section">
<span class="eyebrow">STUDENT PORTAL</span>
<h2>Create account</h2>
<p class="form-subtitle">Your details are stored in this browser only.</p>
<form id="registerForm">
<div class="form-group">
<label for="name">Full name</label>
<input id="name" required placeholder="Your name">
</div>
<div class="form-group">
<label for="email">University email</label>
<input id="email" type="email" required placeholder="you@university.edu">
</div>
<div class="form-group">
<label for="password">Password</label>
<input id="password" type="password" required minlength="4" placeholder="Enter your password">
</div>
<div class="form-group">
<label for="confirmPassword">Confirm password</label>
<input id="confirmPassword" type="password" required placeholder="Enter your password">
</div>
<button class="btn btn-primary" type="submit">Create account</button>
</form>
<p class="top-spacing-large">Already registered? <a href="student-login.html">Sign in</a>
</p>
</div>
<div class="auth-footer">Accounts are stored locally in this browser for this project.</div>
</div>
</div>
<script src="js/data.js">
</script>
<script src="js/script.js">
</script>
</body>
</html>
