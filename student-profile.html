<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student profile | Smart Complaint System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
<div class="container navbar-content">
<a class="brand" href="index.html">Smart <span>Complaint System</span>
</a>
<div class="nav-links">

<a href="index.html" class="logout-link">Log out</a>
</div>
</div>

<main class="page">
<div class="container narrow-container">
<div class="page-title">
<div>
<span class="eyebrow">ACCOUNT</span>
<h1>Student profile</h1>
</div>
</div>
<div class="card">
<form id="studentProfileForm">
<div class="form-group">
<label for="studentName">Name</label>
<input id="studentName" value="Demo student" required>
</div>
<div class="form-group">
<label for="studentEmail">Email</label>
<input id="studentEmail" type="email" value="student@demo.edu" required>
</div>
<button class="btn btn-primary" type="submit">Save profile</button>
<p id="profileMessage" class="notice message-spacing" aria-live="polite">
</p>
</form>
</div>
</div>
</main>
<script src="js/data.js">
</script>
<script src="js/script.js">
</script>
</body>
</html>
