<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin sign in | Smart Complaint System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-container">
<div class="auth-card">
<div class="brand-section">
<div class="logo">SCS</div>
<h1>Admin console</h1>
<p>See the whole campus support picture.</p>
<div class="brand-info">
<span>View all reports</span>
<span>Monitor service levels</span>
<span>Route to departments</span>
</div>
</div>
<div class="form-section">
<span class="eyebrow">ADMIN ACCESS</span>
<h2>Sign in</h2>
<p class="form-subtitle">Use the documented demo credentials.</p>
<form id="adminLoginForm">
<div class="form-group">
<label>Email</label>
<input id="adminEmail" type="email" required placeholder="admin@university.edu">
</div>
<div class="form-group">
<label>Password</label>
<input id="adminPassword" type="password" required placeholder="Enter your password">
</div>
<button class="btn btn-primary">Open admin console</button>
</form>
<p class="top-spacing-large">
<a href="index.html">Back to Smart Complaint System</a>
</p>
<p class="text-muted">No real authentication or database is connected.</p>
</div>
<div class="auth-footer">Smart Complaint System - Admin demo</div>
</div>
</div>
<script src="js/data.js">
</script>
<script src="js/script.js">
</script>
</body>
</html>
