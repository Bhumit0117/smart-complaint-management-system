<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submit complaint | Smart Complaint System</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<nav class="navbar"><div class="container navbar-content"><a class="brand" href="student-dashboard.html">Smart <span>Complaint System</span></a><button class="btn btn-secondary student-menu-toggle" type="button" data-student-menu>Menu</button><div class="nav-links"><span class="text-muted" data-user-name>Demo student</span></div></div></nav>
<div class="student-shell"><aside class="student-sidebar"><nav aria-label="Student navigation">
<a href="student-dashboard.html">Dashboard</a><a class="active" href="student-submit-complaint.html">Submit Complaint</a><a href="student-my-complaints.html">My Complaints</a><a href="student-track-complaint.html">Track Complaint</a><a href="student-notifications.html">Notifications</a><a href="student-profile.html">Profile</a><a class="logout-link" href="student-login.html">Logout</a>
</nav></aside><div class="student-sidebar-backdrop"></div>
<main class="student-main"><div class="container form-container"><div class="page-title"><div><span class="eyebrow">STUDENT PORTAL</span><h1>Submit a complaint</h1><p class="text-muted">Give the team enough context to act quickly.</p></div></div><div class="card"><form id="complaintForm">
<div class="form-group"><label for="title">Complaint Title</label><input id="title" name="title" required placeholder="e.g. Broken classroom projector"></div>
<div class="form-group"><label for="description">Description</label><textarea id="description" name="description" required rows="6" placeholder="What happened, where, and when?"></textarea></div>
<div class="form-group"><label for="category">Category</label><select id="category" name="category"><option>Academic</option><option>IT &amp; Technical</option><option>Electrical</option><option>Hostel</option><option>Cleaning &amp; Sanitation</option><option>Library</option><option>Maintenance</option><option>Transportation</option><option>Other</option></select></div>
<div class="form-group"><label for="priority">Priority</label><select id="priority" name="priority"><option>Low</option><option selected>Medium</option><option>High</option></select></div>
<div class="form-group"><label for="attachments">Photo attachments <span class="text-muted">(optional, up to 5 JPG/PNG/WebP files, 2 MB each)</span></label><input id="attachments" type="file" accept="image/jpeg,image/png,image/webp" multiple><div id="previews" class="preview-grid" aria-live="polite"></div></div>
<button class="btn btn-primary" type="submit">Submit Complaint</button><p id="formMessage" class="notice message-spacing"></p>
</form></div></div></main></div>
<script src="js/data.js"></script><script src="js/script.js"></script>
</body></html>
